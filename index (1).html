<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICEX</title>
<style>
:root{--bg:#000;--fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{min-height:100vh;position:relative;z-index:1}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg svg{display:block;width:100%;height:100%}
.banner{display:block;width:100%;height:auto;max-width:100%}
.welcome{text-align:center;padding:72px 16px 56px;display:flex;flex-direction:column;gap:12px;align-items:center}
.ice{margin:0;font-weight:400;line-height:1.1;background:linear-gradient(180deg,#fff 0%,#cfe6ff 45%,#4da3ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 6px rgba(47,139,255,.9)) drop-shadow(0 0 22px rgba(47,139,255,.55))}
.en{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-size:clamp(34px,9vw,84px);letter-spacing:.04em;transform:skewX(-8deg)}
.ar{font-family:Lalezar,"Segoe UI",Tahoma,sans-serif;font-size:clamp(34px,9vw,84px)}
.form{max-width:560px;margin:0 auto;padding:8px 20px 90px;display:flex;flex-direction:column;gap:34px}
.q{display:flex;flex-direction:column;gap:14px;border:0;padding:0;margin:0;min-width:0}
.lbl{position:relative;display:block;padding:0 0 4px;font-family:Lalezar,"Segoe UI",Tahoma,sans-serif;font-size:clamp(26px,6.5vw,38px);line-height:1.15;color:#9ad8ff;-webkit-text-stroke:1px #e6f6ff;text-shadow:0 0 10px rgba(47,139,255,.95),0 0 26px rgba(47,139,255,.5)}
.opt{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;font-size:.5em;-webkit-text-stroke:0;text-shadow:none;color:#6fb4ee}
.in{font:inherit;font-size:18px;color:#e6f6ff;background:rgba(12,40,90,.6);border:0;padding:15px 18px;outline:0;width:100%;box-sizing:border-box;clip-path:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px));box-shadow:inset 0 0 0 1.5px #4da3ff}
.in::placeholder{color:#5b8bbd}
.in:focus{background:rgba(25,75,150,.7)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:block;padding:12px 22px;font-family:Lalezar,"Segoe UI",Tahoma,sans-serif;font-size:22px;color:#9ad8ff;background:rgba(12,40,90,.6);clip-path:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px));box-shadow:inset 0 0 0 1.5px #4da3ff}
.chip input:checked+span{background:linear-gradient(180deg,#e6f6ff,#4da3ff);color:#021430}
.chip input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.go{margin-top:6px;border:0;cursor:pointer;padding:16px 28px;font-family:Lalezar,"Segoe UI",Tahoma,sans-serif;font-size:28px;color:#021430;background:linear-gradient(180deg,#fff,#7fc2ff 60%,#2f8bff);clip-path:polygon(0 14px,14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px));filter:drop-shadow(0 0 10px rgba(47,139,255,.9))}
.go:disabled{opacity:.6;cursor:default}
.go:focus-visible{outline:2px solid #fff;outline-offset:3px}
.msg{margin:0;text-align:center;font-family:Lalezar,"Segoe UI",Tahoma,sans-serif;font-size:clamp(26px,6.5vw,38px);color:#9ad8ff;text-shadow:0 0 10px rgba(47,139,255,.95),0 0 26px rgba(47,139,255,.5)}
.msg.err{font-size:22px;color:#ffb4b4;text-shadow:none}
.pick{cursor:pointer;text-align:start;color:#9ad8ff;font-family:Lalezar,"Segoe UI",Tahoma,sans-serif;font-size:22px}
.wgrid{display:flex;flex-wrap:wrap;gap:8px}
.wcard{border:0;cursor:pointer;padding:7px 14px;color:#9ad8ff;font-family:Lalezar,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.2;background:rgba(12,40,90,.6);clip-path:polygon(0 6px,6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px));box-shadow:inset 0 0 0 1.5px #4da3ff}
.wcard.on{background:linear-gradient(180deg,#e6f6ff,#4da3ff);color:#021430}
.wcard:focus-visible,.pick:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Lalezar&display=swap">
</head>
<body>
<div class="bg" aria-hidden="true">
<svg viewBox="0 0 1000 1600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="gt" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#2f8bff" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="gb" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#1d6fe0" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#9ad8ff"/><stop offset="1" stop-color="#2f8bff"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="1600" fill="#000"/>
<rect width="1000" height="1600" fill="url(#gt)"/>
<rect width="1000" height="1600" fill="url(#gb)"/>
<g font-family="Anton,Impact,'Arial Narrow',sans-serif" text-anchor="middle" filter="url(#glow)">
<text x="500" y="430" font-size="205" fill="none" stroke="#4da3ff" stroke-width="2.5" opacity=".4" transform="skewX(-8) translate(70 0)">FLEX CITY</text>
<text x="500" y="930" font-size="430" fill="url(#ice)" stroke="#cfe9ff" stroke-width="2" opacity=".16" transform="skewX(-8) translate(130 0)">ICEX</text>
<text x="500" y="1330" font-size="205" fill="url(#ice)" opacity=".12" transform="skewX(-8) translate(190 0)">FLEX CITY</text>
</g>
<g fill="url(#ice)" opacity=".28">
<polygon points="0,1600 0,1180 70,1380 130,1260 190,1520 260,1420 320,1600"/>
<polygon points="1000,1600 1000,1120 930,1330 870,1210 810,1500 740,1400 680,1600"/>
<polygon points="1000,0 1000,260 940,150 890,300 840,120 780,0"/>
<polygon points="0,0 0,200 50,110 100,230 150,90 210,0"/>
</g>
<g fill="#dff3ff">
<circle cx="120" cy="300" r="3" opacity=".5"/><circle cx="860" cy="520" r="2.5" opacity=".45"/><circle cx="300" cy="700" r="2" opacity=".4"/><circle cx="720" cy="780" r="3.5" opacity=".5"/><circle cx="90" cy="980" r="2.5" opacity=".4"/><circle cx="930" cy="1040" r="2" opacity=".45"/><circle cx="450" cy="1180" r="3" opacity=".4"/><circle cx="620" cy="260" r="2" opacity=".5"/><circle cx="230" cy="1450" r="2.5" opacity=".45"/><circle cx="780" cy="1480" r="3" opacity=".4"/><circle cx="520" cy="560" r="2" opacity=".35"/><circle cx="60" cy="640" r="2" opacity=".4"/>
</g>
</svg>
</div>
<main>
<section class="welcome">
<h1 class="ice en" dir="ltr" lang="en">WELCOME TO ICEX</h1>
<h2 class="ice ar">أهلاً بيك في ICEX</h2>
</section>
<form class="form" id="f" autocomplete="off">
<div class="q"><label class="lbl" for="name">اسمك</label><input class="in" id="name" name="name" required maxlength="60" placeholder="اكتب اسمك هنا"></div>
<fieldset class="q"><legend class="lbl">عمرك</legend>
<div class="chips">
<label class="chip"><input type="radio" name="age" value="+18" required><span>+18</span></label>
<label class="chip"><input type="radio" name="age" value="+15"><span>+15</span></label>
<label class="chip"><input type="radio" name="age" value="other"><span>غير كده</span></label>
</div>
<input class="in" id="agenum" name="agenum" type="number" min="1" max="99" inputmode="numeric" placeholder="اكتب عمرك" hidden>
</fieldset>
<div class="q"><label class="lbl" for="src">عرفت العصابة منين؟ <span class="opt">(اختياري)</span></label><input class="in" id="src" name="source" maxlength="200" placeholder="تيك توك، صاحب، ..."></div>
<div class="q"><span class="lbl">ايه الأسلحة اللي معاك؟ <span class="opt">(اختياري، تقدر تختار أكتر من سلاح)</span></span>
<input type="hidden" name="weapon" id="weapon">
<button type="button" class="in pick" id="pick" aria-expanded="false" aria-controls="wp">اضغط واختار الأسلحة</button>
<div class="wgrid" id="wp" hidden>
<button type="button" class="wcard" data-w="SX90"><span>SX90</span></button>
<button type="button" class="wcard" data-w="Dual Uzi"><span>Dual Uzi</span></button>
<button type="button" class="wcard" data-w="Cord Scope Gun"><span>Cord Scope Gun</span></button>
<button type="button" class="wcard" data-w="Uzi"><span>Uzi</span></button>
<button type="button" class="wcard" data-w="P90"><span>P90</span></button>
<button type="button" class="wcard" data-w="Spitfire"><span>Spitfire</span></button>
<button type="button" class="wcard" data-w="AK-47"><span>AK-47</span></button>
<button type="button" class="wcard" data-w="M4"><span>M4</span></button>
<button type="button" class="wcard" data-w="Octane Gun"><span>Octane Gun</span></button>
<button type="button" class="wcard" data-w="AUV 10 Gun"><span>AUV 10 Gun</span></button>
<button type="button" class="wcard" data-w="XM 24 Shotgun"><span>XM 24 Shotgun</span></button>
<button type="button" class="wcard" data-w="Pump Shotgun"><span>Pump Shotgun</span></button>
<button type="button" class="wcard" data-w="RPG"><span>RPG</span></button>
<button type="button" class="wcard" data-w="Evo Zenith"><span>Evo Zenith</span></button>
<button type="button" class="wcard" data-w="Evo Gun"><span>Evo Gun</span></button>
<button type="button" class="wcard" data-w="Crossbow"><span>Crossbow</span></button>
<button type="button" class="wcard" data-w="other"><span>سلاح تاني</span></button>
</div>
<input class="in" id="wother" maxlength="60" placeholder="اكتب اسم السلاح" hidden>
</div>
<fieldset class="q"><legend class="lbl">ايه الأيام اللي بتفتح فيها؟</legend>
<div class="chips">
<label class="chip"><input type="checkbox" name="days" value="الأحد"><span>الأحد</span></label>
<label class="chip"><input type="checkbox" name="days" value="الاثنين"><span>الاثنين</span></label>
<label class="chip"><input type="checkbox" name="days" value="الثلاثاء"><span>الثلاثاء</span></label>
<label class="chip"><input type="checkbox" name="days" value="الأربعاء"><span>الأربعاء</span></label>
<label class="chip"><input type="checkbox" name="days" value="الخميس"><span>الخميس</span></label>
<label class="chip"><input type="checkbox" name="days" value="الجمعة"><span>الجمعة</span></label>
<label class="chip"><input type="checkbox" name="days" value="السبت"><span>السبت</span></label>
</div>
</fieldset>
<button class="go" id="go" type="submit">ابعت</button>
<p class="msg err" id="err" hidden>الإرسال مش شغال دلوقتي، جرب تاني بعد شوية.</p>
</form>
<p class="msg" id="ok" hidden style="padding:0 20px 90px">وصلنا طلبك، أهلاً بيك في العصابة</p>
</main>
<script>
(function(){
var f=document.getElementById('f'),num=document.getElementById('agenum'),go=document.getElementById('go'),err=document.getElementById('err'),ok=document.getElementById('ok');
var pick=document.getElementById('pick'),wp=document.getElementById('wp'),wv=document.getElementById('weapon'),wo=document.getElementById('wother');
pick.addEventListener('click',function(){var open=wp.hidden;wp.hidden=!open;pick.setAttribute('aria-expanded',String(open));});
function upd(){
var sel=[].slice.call(wp.querySelectorAll('.wcard.on')).map(function(c){return c.getAttribute('data-w');});
var other=sel.indexOf('other')>-1;
sel=sel.filter(function(x){return x!=='other';});
var ot=wo.value.trim();
if(other&&ot)sel.push(ot);
wo.hidden=!other;
wv.value=sel.join('، ');
pick.textContent=sel.length?sel.join('، '):'اضغط واختار الأسلحة';
}
wp.addEventListener('click',function(e){var b=e.target.closest('.wcard');if(!b)return;b.classList.toggle('on');b.setAttribute('aria-pressed',String(b.classList.contains('on')));upd();if(b.getAttribute('data-w')==='other'&&b.classList.contains('on'))wo.focus();});
wo.addEventListener('input',upd);
f.addEventListener('change',function(e){if(e.target.name==='age'){var o=e.target.value==='other';num.hidden=!o;num.required=o;if(o)num.focus();}});
f.addEventListener('submit',async function(e){
e.preventDefault();err.hidden=true;go.disabled=true;
var d=new FormData(f);
var age=d.get('age')==='other'?String(d.get('agenum')||''):String(d.get('age')||'');
var rec={name:String(d.get('name')||'').trim(),age:age,source:String(d.get('source')||'').trim(),weapon:String(d.get('weapon')||''),days:d.getAll('days').join('، '),at:new Date().toISOString()};
var sent=false;
try{
var r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({access_key:'b9595bbf-a46b-4c27-a540-f4a9e669a07e',subject:'تقديم جديد في ICEX',from_name:'ICEX','الاسم':rec.name,'العمر':rec.age,'السلاح':rec.weapon,'الأيام':rec.days,'عرفت العصابة منين':rec.source})});
var j=await r.json();sent=!!(j&&j.success);
}catch(x){}
if(!sent){try{
if(!window.claude)throw new Error('nodb');
var db=await Promise.race([window.claude.use('db'),new Promise(function(r){setTimeout(function(){r(null)},10000)})]);
if(!db)throw new Error('nodb');
var us=await window.claude.use('user');
if(!us||!us.id)throw new Error('nouser');
var uid=await us.id();
await db.doc('applications/'+uid).set(rec);
sent=true;
}catch(y){}}
if(sent){f.hidden=true;ok.hidden=false;}else{err.hidden=false;go.disabled=false;}
});
})();
</script>
</body>
</html>
